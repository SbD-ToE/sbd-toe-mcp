name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      RELEASE_OUTPUT_DIR: release

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate tag format
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release tag: $tag (npm dist-tag 'latest')"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag: $tag (npm dist-tag 'beta', GitHub pre-release; 'latest' untouched)"
          else
            echo "Error: tag must be vX.Y.Z (stable) or vX.Y.Z-<prerelease> (e.g. v0.20.0-beta.0)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate tagged commit
        run: |
          npm run check
          npm run build
          npm run check:npm-package

      - name: Verify tag is on the expected branch
        shell: bash
        env:
          # Branch that owns the beta/prerelease line. Stable tags must be on master.
          BETA_BRANCH: "0.20-beta"
        run: |
          set -euo pipefail
          if [ "${{ steps.tagcheck.outputs.prerelease }}" = "true" ]; then
            target="refs/remotes/origin/${BETA_BRANCH}"; label="${BETA_BRANCH}"
          else
            target="refs/remotes/origin/master"; label="master"
          fi
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" "$target"; then
            echo "Error: Tag ${GITHUB_REF_NAME} is not on ${label} branch"
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} is on ${label}"

      - name: Build release bundle
        run: node scripts/package-release.mjs --version "${GITHUB_REF_NAME}" --output-dir "${RELEASE_OUTPUT_DIR}"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=("${RELEASE_OUTPUT_DIR}"/*)

          prerelease_flag=""
          if [ "${{ steps.tagcheck.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              $prerelease_flag
          fi

      - name: Verify package.json version matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./package.json').version")
          if [ "$expected" != "$actual" ]; then
            echo "Error: package.json version ($actual) does not match tag ($expected)."
            echo "Bump package.json + package-lock.json on master before tagging."
            exit 1
          fi
          lock_actual=$(node -p "require('./package-lock.json').version")
          if [ "$expected" != "$lock_actual" ]; then
            echo "Error: package-lock.json version ($lock_actual) does not match tag ($expected)."
            echo "Run npm install --package-lock-only on master before tagging."
            exit 1
          fi
          echo "OK: package.json and package-lock.json version $actual matches tag $expected"

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.tagcheck.outputs.prerelease }}" = "true" ]; then
            echo "Publishing prerelease to npm dist-tag 'beta' ('latest' unchanged)"
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi
