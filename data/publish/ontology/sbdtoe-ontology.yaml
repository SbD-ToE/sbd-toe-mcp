# ---------------------------------------------------------------------------
# control_domains + controls — catálogo canónico dos controlos SbD-ToE (v2.1, 2026-08-30, portão G-a)
# Antes de v2.1 os controlos viviam como CONTROL_TEMPLATES em código do compilador (sbd-toe-knowledge-graph,
# agents/canonical_controls.py). A partir desta versão a ontologia é a fonte de verdade; o compilador carrega esta
# secção (Codex S1). Regras contratuais desta secção:
#  - control_id = "CTRL-" + slugify(domain + "-" + name) + "-" + sha1(domain + ":" + name.lower())[:10]; nomes e ids
#    dos 16 controlos existentes são inalterados (estabilidade de identificadores); renomear = novo id.
#  - defining_chapters = capítulos que DEFINEM o controlo (é o que dá grounding no linking Requisito→Controlo e o
#    bónus de capítulo no resolver de práticas); cited_chapters = capítulos das práticas absorvidas que não o definem
#    (proveniência, sem grounding). O compilador publica chapter_ids = defining_chapters e cited_chapter_ids à parte.
#  - practice_assignments são EXPLÍCITAS para todas as práticas do Manual v1.7.1 (260) e vencem qualquer scoring;
#    práticas futuras sem atribuição resolvem por: +5 se chapter_id ∈ defining_chapters, +2 por keyword no rótulo,
#    empate desfeito por resolution_order ascendente (nunca por ordem de ficheiro).
#  - anchor_kind: practice (definido por práticas do Manual) | catalogue (definido por catálogo de requisitos + plano
#    de validação; practice_assignments vazio é legítimo e não conta contra a cobertura).
# ---------------------------------------------------------------------------
