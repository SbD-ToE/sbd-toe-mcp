    requirements: 7
    default: CTRL-governance-classificacao-e-governacao-por-risco-97aceecf29
    rationale: "Definição, revisão, versionamento e rastreabilidade de requisitos são o processo de requisitos do cap. 02 (práticas US-01…12 atribuídas a CLA em v2.1). REQ-001 já é curada → CLA. REQ-005 ganha THR como secundária."
    overrides:
    - requirement_id: REQ-005
      primary: CTRL-governance-classificacao-e-governacao-por-risco-97aceecf29
      secondary:
