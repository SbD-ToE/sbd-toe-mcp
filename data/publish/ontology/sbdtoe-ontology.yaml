catalogue_rules:
  schema_version: '1.0'
  # v2.2 (2026-08-30, decisão do programme lead pré-G-b): os requisitos do catálogo-base do cap. 02 (type: base, 104)
  # ligam-se a controlos por REGRA DE CATÁLOGO (categoria → controlo, com overrides por requisito), com confiança declarada
  # como regra e justification: catalogue_rule; o scoring lexical NÃO corre sobre type: base. A curadoria prevalece sempre.
  applies_to:
    requirement_type: base
    requirement_ids_count: 104
  precedence:
  - curation
  - catalogue_rule
  - scoring
  lexical_scoring_on_base: false
  confidence:
    primary: 0.92
    secondary: 0.8
  justification:
    primary: catalogue_rule
    secondary: catalogue_rule_secondary
  source_mode: catalogue_rule
  authority_class: normative
  confidence_model: deterministic
  max_links_per_requirement: 2
  curation_interaction: "Se o requisito tem primária curada (retarget/add-primary), a regra não cria primária; fornece no máximo a secundária declarada aqui, se ainda houver lugar. Arestas curadas nunca são substituídas por regra."
  fallback_expectation: "domain_owner_fallback deve ser 0 para type: base; qualquer sobra é reportada como desvio."
  categories:
  - category: AUT
    requirements: 10
    default: CTRL-identity-identidade-autenticacao-e-sessoes-aplicacionais-c9d3f51e82
    rationale: "Autenticação e identidade da aplicação — âncora do próprio C1 (cap. 02 addon-02 §AUT; addon-07 §4). AUT-010: a primária curada MON (D1) prevalece; a regra fornece C1 como secundária."
    overrides: []
  - category: ACC
    requirements: 10
    default: CTRL-identity-identidade-autenticacao-e-sessoes-aplicacionais-c9d3f51e82
    rationale: "Controlo de acesso (RBAC/ABAC, privilégio mínimo, revisão de permissões) é autorização aplicacional — C1."
    overrides: []
  - category: SES
    requirements: 8
    default: CTRL-identity-identidade-autenticacao-e-sessoes-aplicacionais-c9d3f51e82
    rationale: "Ciclo de vida de sessões e tokens — C1 (SES-004 «transmissão por TLS» ganha C2 como secundária)."
    overrides:
    - requirement_id: SES-004
      primary: CTRL-identity-identidade-autenticacao-e-sessoes-aplicacionais-c9d3f51e82
      secondary:
      - CTRL-data-protection-criptografia-aplicacional-e-proteccao-de-dados-a4afa5b411
      rationale: "tokens só por TLS + flags de cookie: sessão (C1) com protecção de transporte (C2)"
  - category: ENC
    requirements: 9
    default: CTRL-data-protection-criptografia-aplicacional-e-proteccao-de-dados-a4afa5b411
    rationale: "Dados sensíveis, criptografia, hashing e integridade — âncora do próprio C2 (§ENC; T06/T07). ENC-007: a primária curada SECR (D1) prevalece; regra fornece C2 como secundária. ENC-004 (hashing de passwords) é C2 por ser primitiva criptográfica, com C1 como secundária."
    overrides:
    - requirement_id: ENC-004
      primary: CTRL-data-protection-criptografia-aplicacional-e-proteccao-de-dados-a4afa5b411
      secondary:
      - CTRL-identity-identidade-autenticacao-e-sessoes-aplicacionais-c9d3f51e82
      rationale: "hashing adaptativo é primitiva criptográfica; protege credenciais (C1 sec.)"
    - requirement_id: ENC-006
      primary: CTRL-data-protection-criptografia-aplicacional-e-proteccao-de-dados-a4afa5b411
      secondary:
      - CTRL-code-integrity-desenvolvimento-seguro-e-validacao-de-codigo-63dedd7460
      rationale: "detecção de segredos em repositórios: exposição de dados (C2) verificada no pipeline de código (DEV sec.)"
