    requirements: 6
    default: CTRL-code-integrity-ambiente-e-tooling-de-desenvolvimento-governados-77015fa38a
    rationale: "Ferramentas, extensões, assistentes e ambientes locais — âncora do próprio C3 (§IDE; addon-09 regras 1–5)."
    overrides:
    - requirement_id: IDE-003
      primary: CTRL-code-integrity-ambiente-e-tooling-de-desenvolvimento-governados-77015fa38a
      secondary:
      - CTRL-code-integrity-desenvolvimento-seguro-e-validacao-de-codigo-63dedd7460
      rationale: "revisão de código gerado por ferramentas: governação do tooling (C3) aplicada na revisão de código (DEV sec.)"
  - category: DST
    requirements: 7
    default: null
    rationale: "Distribuição de artefactos não tem controlo único: cada requisito aponta ao controlo que o define — identidade de acesso a repositórios, custódia/assinatura em pipelines, SBOM/revogação em dependências, deploy só por pipeline. Resolve DST-002/005 (S2 divergentes)."
    overrides:
    - requirement_id: DST-001
      primary: CTRL-identity-gestao-de-identidades-acessos-e-ownership-d0919c69af
      secondary: []
      rationale: "autenticação obrigatória e logs de acesso a repositórios de artefactos = identidade/acesso de toolchain (IDN)"
    - requirement_id: DST-002
      primary: CTRL-code-integrity-integridade-e-governacao-de-pipelines-d5b14eeef2
      secondary:
      - CTRL-supply-chain-supply-chain-segura-de-imagens-e-containers-8a8af25a4d
      rationale: "aprovação formal para publicação pública = não-repúdio e ownership de promoções (PIPE); registries públicos de imagens (IMG sec.)"
    - requirement_id: DST-003
      primary: CTRL-code-integrity-integridade-e-governacao-de-pipelines-d5b14eeef2
      secondary: []
      rationale: "assinatura digital/checksum antes de publicação = assinatura e proveniência de artefactos (PIPE)"
    - requirement_id: DST-004
      primary: CTRL-supply-chain-inventario-e-analise-de-dependencias-6b0fd9f7fb
      secondary: []
      rationale: "SBOM anexado a cada release = inventário de dependências (DEPS)"
    - requirement_id: DST-005
      primary: CTRL-identity-gestao-de-identidades-acessos-e-ownership-d0919c69af
      secondary:
      - CTRL-infrastructure-deploy-seguro-e-reversivel-ae204be5f0
      rationale: "acesso segregado por role e ambiente a artefactos de produção = identidade/acesso (IDN); segregação de ambientes no deploy (DEPL sec.)"
    - requirement_id: DST-006
      primary: CTRL-infrastructure-deploy-seguro-e-reversivel-ae204be5f0
      secondary:
      - CTRL-code-integrity-integridade-e-governacao-de-pipelines-d5b14eeef2
      rationale: "deploy apenas via pipeline validado = deploy seguro (DEPL); pipeline auditado (PIPE sec.)"
    - requirement_id: DST-007
      primary: CTRL-supply-chain-inventario-e-analise-de-dependencias-6b0fd9f7fb
      secondary:
      - CTRL-supply-chain-supply-chain-segura-de-imagens-e-containers-8a8af25a4d
      rationale: "revogação e limpeza de artefactos comprometidos = resposta a vulnerabilidades em componentes (DEPS); retenção/revogação de imagens (IMG sec.)"
  - category: CFG
    requirements: 7
    default: null
    rationale: "Configuração segura: IaC/ambientes quando é configuração de infraestrutura e ambientes; segredos quando é material sensível; código quando é comportamento da aplicação (CFG-005, desvio justificado do enquadramento «IaC ou segredos»)."
    overrides:
    - requirement_id: CFG-001
      primary: CTRL-infrastructure-infraestrutura-como-codigo-governada-5228bca905
      secondary:
      - CTRL-infrastructure-deploy-seguro-e-reversivel-ae204be5f0
